services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billdaddy
      MYSQL_USER: billdaddy
      MYSQL_PASSWORD: billdaddy
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbilldaddy", "-ubilldaddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: mysql+pymysql://billdaddy:billdaddy@db:3306/billdaddy
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
