<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillDaddy — logowanie</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-sm mx-auto mt-24 bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-emerald-700 mb-1">BillDaddy</h1>
    <p class="text-sm text-gray-500 mb-4">zaloguj się</p>
    {% if error %}<p class="text-sm text-red-600 mb-3">{{ error }}</p>{% endif %}
    <form method="post" class="grid gap-3">
      <input name="username" placeholder="login" required class="border rounded px-3 py-2">
      <input name="password" type="password" placeholder="hasło" required class="border rounded px-3 py-2">
      <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Zaloguj</button>
    </form>
  </div>
</body>
</html>
