<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillDaddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-emerald-700 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <h1 class="text-2xl font-bold">BillDaddy</h1>
      <p class="text-emerald-100 text-sm">wydatki z paragonów + ceny w czasie</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-3">
    <section class="lg:col-span-2 bg-white rounded-lg shadow p-4">
      <h2 class="font-semibold mb-3">Dodaj paragon</h2>
      <form id="upload-form" class="flex flex-wrap items-center gap-3">
        <input type="file" name="image" accept="image/*" required
               class="text-sm file:mr-3 file:py-2 file:px-4 file:rounded file:border-0 file:bg-emerald-50 file:text-emerald-700">
        <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Wyślij</button>
        <span id="upload-status" class="text-sm text-gray-500"></span>
      </form>

      <div id="draft" class="hidden mt-5">
        <div class="grid sm:grid-cols-3 gap-3 mb-3 text-sm">
          <label>Sklep <input id="d-shop" class="w-full border rounded px-2 py-1"></label>
          <label>Data <input id="d-date" type="date" class="w-full border rounded px-2 py-1"></label>
          <label>Suma <input id="d-total" type="number" step="0.01" class="w-full border rounded px-2 py-1"></label>
        </div>
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500 border-b">
              <th class="py-1">Z paragonu</th>
              <th>Produkt</th>
              <th>Kategoria</th>
              <th class="text-right">Ilość</th>
              <th class="text-right">Cena</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="draft-items"></tbody>
        </table>
        <datalist id="product-list"></datalist>
        <div class="flex items-center gap-3 mt-3">
          <button id="add-row" type="button" class="text-sm text-emerald-700 hover:underline">+ dodaj pozycję</button>
          <span class="flex-1"></span>
          <span id="confirm-status" class="text-sm"></span>
          <button id="confirm" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Zatwierdź</button>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-lg shadow p-4">
      <h2 class="font-semibold mb-3">Wydatki wg kategorii</h2>
      <div class="flex gap-2 text-sm mb-3">
        <input id="f-from" type="date" class="border rounded px-2 py-1 w-full">
        <input id="f-to" type="date" class="border rounded px-2 py-1 w-full">
      </div>
      <canvas id="pie"></canvas>
      <p id="pie-total" class="text-center text-sm text-gray-600 mt-2"></p>
    </section>

    <section class="lg:col-span-3 bg-white rounded-lg shadow p-4">
      <div class="flex flex-wrap items-center gap-3 mb-3">
        <h2 class="font-semibold">Historia cen</h2>
        <select id="price-product" class="border rounded px-2 py-1 text-sm"></select>
        <span id="price-change" class="text-sm"></span>
      </div>
      <div class="h-64"><canvas id="line"></canvas></div>
    </section>

    <section class="lg:col-span-3 bg-white rounded-lg shadow p-4">
      <h2 class="font-semibold mb-3">Paragony</h2>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500 border-b">
            <th class="py-1">Data</th><th>Sklep</th><th class="text-right">Suma</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="receipts"></tbody>
      </table>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
